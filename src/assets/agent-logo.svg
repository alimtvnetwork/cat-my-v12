<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plan 90 Step 129 - Agent logo for the CLI UI.
  Domain: machine-vision inspection agent. Glyph combines a camera
  aperture (six blades) with a reticle crosshair and a scan-line
  underscore to read as "vision + agent + terminal". Pure stroke,
  `currentColor` so it inherits `text-ca-ink` in the header and
  respects light/dark theme without hardcoded hex.
  Do NOT swap to a Sparkles/AI generic mark (see Step 128 rationale).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Cat-my-UI CLI agent" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <title>Cat-my-UI CLI agent</title>
  <!-- aperture ring -->
  <circle cx="16" cy="15" r="9" />
  <!-- six aperture blades -->
  <path d="M16 6 L21 12 L21 18 L16 24 L11 18 L11 12 Z" opacity="0.55" />
  <!-- reticle crosshair -->
  <path d="M16 10.5 V13" />
  <path d="M16 17 V19.5" />
  <path d="M10.5 15 H13" />
  <path d="M19 15 H21.5" />
  <!-- pupil -->
  <circle cx="16" cy="15" r="1.3" fill="currentColor" stroke="none" />
  <!-- scan-line underscore (terminal cursor) -->
  <path d="M9 28 H23" opacity="0.7" />
</svg>
