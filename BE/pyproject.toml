[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"BE" = "."}
packages = ["BE", "BE.app", "BE.app.db.writers", "BE.app.domain", "BE.app.facades", "BE.app.rules", "BE.cli", "BE.cli.common", "BE.cli.processing", "BE.cli.processing.commands", "BE.cli.processing.helptext", "BE.cli.worker", "BE.cli.worker.helptext", "BE.cli.worker.subcommands", "BE.db", "BE.errors", "BE.middleware", "BE.migrations", "BE.models", "BE.repos", "BE.routes", "BE.routes.observability", "BE.sdk_facade", "BE.sdk_facade.vendors", "BE.sdk_facade.vendors.daheng", "BE.security", "BE.tests", "BE.tests.app", "BE.tests.app.rules", "BE.tests.cli", "BE.tests.cli.common", "BE.tests.cli.processing", "BE.tests.cli.retention", "BE.tests.cli.worker", "BE.tests.db", "BE.tests.errors"]
[project]
name = "be"
version = "0.1.0"
description = "Control Automation public HTTP surface (FastAPI). See Plan 88, spec/21-app/backend-implementation-request-v1.md."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]
camera-daheng = [
  # "gxipy>=2.0", # Removed for local dev without SDK
]

[project.scripts]
be-dev = "BE.main:dev"
worker-cli = "BE.cli.worker.main:main"
processing-cli = "BE.cli.processing.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501", "E402", "B008", "B011", "B017", "E741", "SIM105", "SIM117", "F821", "F401", "E702"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["BE/tests"]
