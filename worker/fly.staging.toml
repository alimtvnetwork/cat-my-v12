# Staging Fly config for the validation worker. Copy of fly.toml with a
# distinct app name and WORKER_VERSION suffix so `/healthz` reveals which
# environment answered. Deploy with:
#   ./worker/deploy.sh --env staging <app-name>
app = "control-automation-validator-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "DEBUG"
  WORKER_VERSION = "0.1.0-staging"
  WORKER_ENV = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"