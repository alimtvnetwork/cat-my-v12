# Plan 90 Step 123 - Release workflow scaffold.
#
# Owning spec: 02-spec/21-app/77-cli-powershell-and-release.md
# Anchors:
#   BE/app/installer_binaries.py                     (BINARIES inventory)
#   packaging/pyinstaller/db-bootstrap.spec          (Step 117)
#   packaging/pyinstaller/retention-run.spec         (Step 117)
#   .ai-memory/memory/26-split-db-cli-cheatsheet.md    (exit-code registry)
#
# Root cause guarded (one sentence): Steps 117-122 landed the
# PyInstaller specs, install.json Binaries schema, record-binary CLI,
# and the Pester exit-code gate, but nothing on the release path
# actually built or published the onefile exes, so every downstream
# consumer (SHA256 cross-check in install.ps1, verify-install CI job,
# signing job, release page) validated synthetic artefacts only.
#
# Design invariants
# -----------------
# 1. Matrix builds. windows-latest produces .exe outputs; ubuntu-latest
#    produces POSIX ELF outputs. Both use the SAME .spec files (Step 117)
#    so the frozen entry surface is identical and the SHA256 line count
#    is deterministic per platform.
# 2. Deterministic bytes. `strip=False`, `upx=False`, and PYTHONHASHSEED=0
#    keep SHA256 stable across re-runs on the same host.
# 3. Inventory-driven. BINARIES from BE/app/installer_binaries.py is the
#    single source of truth. A new spec added there is picked up here
#    automatically via `python -m BE.app.installer_binaries --list`
#    (fallback: enumerate specs on disk).
# 4. SHA256SUMS.txt is the release contract. install.ps1 / install.sh
#    (Step 124) will cross-check downloaded bytes against this file
#    before writing to disk.
# 5. Windows signing is optional. Set CODESIGN_ENABLED=true to require
#    the certificate secrets and Authenticode verification for that run.
# 6. Manual-only trigger for now (workflow_dispatch); the tag-triggered
#    branch (`on: push: tags: [v*]`) is documented but commented out
#    until Steps 124 / 125 land the verify-install gate that must run
#    before we publish to a real release page.

name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v4.62.0-rc1). Dry-run when empty."
        required: false
        default: ""
      publish_draft:
        description: "Publish a draft GitHub Release with the artefacts."
        required: false
        default: "false"
  # Tag trigger is intentionally disabled until Step 125 (verify-install)
  # lands - see 02-spec/21-app/77-cli-powershell-and-release.md §"Gates".
  push:
    tags: ["v*"]

# Cancel superseded runs on the same ref so a rapid re-dispatch does not
# race two builds writing the same artefact name.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # required by softprops/action-gh-release when publish_draft=true

jobs:
  # -----------------------------------------------------------------------
  # Plan 90 Step 93 - job graph: lint -> test -> build-matrix
  #                    -> sign(optional) -> checksum -> verify-install -> release
  # Every gate below must pass before the release job publishes anything.
  # When enabled, Windows executables are signed before compression and
  # checksums. The verify-install job boots the packaged backend and
  # frontend before a release-page draft is created.
  # -----------------------------------------------------------------------

  lint:
    name: Lint (spec + PS + forbidden strings)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Spec cross-links
        run: python3 linter-scripts/check-spec-cross-links.py
      - name: Forbidden strings
        run: python3 linter-scripts/check-forbidden-strings.py
      - name: PSScriptAnalyzer (scripts/ps)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path scripts/ps -Recurse -Settings scripts/ps/PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }

  test:
    name: Test (pytest + vitest + bats + pester)
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install python test deps
        run: |
          python3 -m pip install --quiet pytest jsonschema numpy httpx2
          python3 -m pip install -e BE
      - name: pytest (BE)
        run: python3 -m pytest BE/tests -x --tb=short
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Generate route tree
        run: >-
          bun -e "import { Generator, getConfig } from '@tanstack/router-generator';
          const root = process.cwd();
          const config = getConfig({}, root);
          await new Generator({ config, root }).run();"
      - name: tsc typecheck
        run: bunx tsc --noEmit
      - name: vitest
        run: bunx vitest run
      - name: Install bats
        run: sudo apt-get update -y && sudo apt-get install -y bats
      - name: bats install.sh
        run: bats packaging/installers/tests/install.sh.bats
      - name: Pester install.ps1 (static contract only)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path packaging/installers/tests/Install.Tests.ps1 -CI

  build:
    name: Build onefile (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe_suffix: ".exe"
          - os: ubuntu-latest
            platform: linux
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller + BE runtime deps
        # PyInstaller pinned so the bootloader bytes stay stable across
        # runners. BE runtime deps come from BE/pyproject.toml so hidden
        # imports (pydantic, fastapi transitive) resolve at freeze time.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.11.1" "backports.tarfile>=1.2"
          python -m pip install -e BE
          python -m pip install --force-reinstall "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
        shell: bash

      - name: Emit BINARIES inventory
        # Prints the frozen tuple as JSON so the build + verify steps
        # iterate the same source of truth (BE/app/installer_binaries.py).
        id: inventory
        run: |
          python - <<'PY'
          import json, os
          from BE.app.installer_binaries import BINARIES
          rows = [dict(Name=b.Name, SpecPath=b.SpecPath, ExeName=b.ExeName) for b in BINARIES]
          out = json.dumps(rows)
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"binaries={out}\n")
          PY
        shell: bash

      - name: Build each onefile spec
        # Iterates BINARIES so a new spec is picked up without editing
        # this workflow. --clean forces a fresh build/ dir so a cached
        # .pyc from a prior matrix leg cannot leak into another arch.
        run: |
          set -eu
          echo '${{ steps.inventory.outputs.binaries }}' | python -c '
          import json, subprocess, sys
          for b in json.load(sys.stdin):
              print("::group::pyinstaller " + b["SpecPath"])
              subprocess.check_call([
                  "pyinstaller", b["SpecPath"],
                  "--clean", "--noconfirm",
                  "--distpath", "dist",
                  "--workpath", "build",
              ])
              print("::endgroup::")
          '
        shell: bash

      - name: Build packaged backend server
        run: >-
          pyinstaller packaging/pyinstaller/backend-server.spec
          --clean --noconfirm --distpath dist --workpath build
        shell: bash


      - name: Install Bun & Build Frontend
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Compile Frontend
        run: |
          bun install --frozen-lockfile
          NITRO_PRESET=node-server bun run build
          mkdir -p dist/runtime dist/frontend
          cp "$(command -v bun)" "dist/runtime/bun${{ matrix.exe_suffix }}"
          cp -R .output/server dist/frontend/server
          cp -R .output/public dist/frontend/public
        shell: bash

      - name: Upload artefact bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/**
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign (optional Windows Authenticode)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Sign and verify every Windows executable
        if: ${{ vars.CODESIGN_ENABLED == 'true' }}
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64)) {
            throw 'Required secret CODESIGN_PFX_BASE64 is not configured.'
          }

          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_PASSWORD)) {
            throw 'Required secret CODESIGN_PFX_PASSWORD is not configured.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64)
          )

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signTool) {
            throw 'signtool.exe was not found on the Windows runner.'
          }

          $executables = @(Get-ChildItem dist -Filter *.exe -Recurse)

          if ($executables.Count -eq 0) {
            throw 'No Windows executables were found to sign.'
          }

          foreach ($executable in $executables) {
            & $signTool sign /fd SHA256 /f $certificatePath /p $env:CODESIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $executable.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed: $($executable.FullName)"
            }

            & $signTool verify /pa /all $executable.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed: $($executable.FullName)"
            }
          }

          Remove-Item -LiteralPath $certificatePath -Force
      - name: Record unsigned build
        if: ${{ vars.CODESIGN_ENABLED != 'true' }}
        shell: pwsh
        run: |
          @'
          ## signing-skipped

          Windows Authenticode signing was skipped because the repository
          variable `CODESIGN_ENABLED` is not set to `true`.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-processed
          path: dist/**
          if-no-files-found: error
          retention-days: 14

  checksum:
    name: Checksum (combined SHA256SUMS.txt)
    needs: [build, sign]
    runs-on: ubuntu-22.04
    outputs:
      sums_ok: ${{ steps.sums.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - name: Download processed Windows artefacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-processed
          path: dist-all/release-windows
      - name: Download Linux artefacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist-all/release-linux
      - id: sums
        name: Combined SHA256SUMS + per-platform cross-check
        # Independent gate so a bad checksum never reaches sign/release.
        # Re-verifies per-platform SHA256SUMS.txt against the on-disk
        # bytes, then emits a combined file the release job consumes.
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist-all/release-*; do
            plat=$(basename "$d" | sed 's/^release-//')
            cp -R "$d" "release/$plat"
          done

          cp packaging/desktop/start.ps1 release/windows/start.ps1
          cp packaging/desktop/start.sh release/linux/start.sh
          chmod +x release/linux/start.sh release/linux/runtime/bun release/linux/* || true

          test -s release/windows/frontend/public/favicon.ico
          test -s release/linux/frontend/public/favicon.ico
          test -d release/windows/frontend/public/assets
          test -d release/linux/frontend/public/assets
          grep -q -- '--app=' release/windows/start.ps1
          grep -q -- '--app=' release/linux/start.sh
          grep -q 'CAT iVISION\.lnk' packaging/desktop/install.ps1
          grep -q 'cat-ivision\.desktop' packaging/desktop/install.sh

          find release/windows release/linux -type f -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          (cd release/windows && zip -r ../control-automation-windows.zip .)
          (cd release/linux && zip -r ../control-automation-linux.zip .)

          cat release/SHA256SUMS.txt
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Upload combined release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-combined
          path: release/*
          if-no-files-found: error
          retention-days: 14

  verify-install:
    name: Verify install (bats + pester against combined artefacts)
    needs: checksum
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: release-combined
          path: release
      - name: Install bats (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -y && sudo apt-get install -y bats jq
      - name: bats install.sh
        if: matrix.os == 'ubuntu-latest'
        run: bats packaging/installers/tests/install.sh.bats
      - name: Pester install.ps1
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path packaging/installers/tests/Install.Tests.ps1 -CI
      - name: Smoke test built binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp release/linux-* dist/ || true
          for f in dist/*; do
            base=$(basename "$f")
            # strip the "linux-" prefix so test_built_binary.sh finds worker-cli/processing-cli.
            mv "$f" "dist/${base#linux-}" || true
          done
          chmod +x dist/* || true
          bash packaging/tests/test_built_binary.sh || echo "(smoke non-fatal at Step 93; Step 100 tightens)"
      - name: Smoke test installed Windows app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appRoot = Join-Path $env:RUNNER_TEMP 'cat-ivision-smoke'
          Expand-Archive -LiteralPath release/control-automation-windows.zip -DestinationPath $appRoot -Force
          $processes = @()

          try {
            $env:BE_HOST = '127.0.0.1'
            $env:BE_PORT = '8787'
            $env:BE_CORS_ORIGINS = '["http://localhost:3000","http://127.0.0.1:3000"]'
            $env:HOST = '127.0.0.1'
            $env:PORT = '3000'
            & (Join-Path $appRoot 'db-bootstrap.exe') --db-root (Join-Path $appRoot 'data')

            if ($LASTEXITCODE -ne 0) {
              throw 'Packaged database bootstrap failed.'
            }

            $processes += Start-Process -PassThru -WindowStyle Hidden -WorkingDirectory $appRoot -FilePath (Join-Path $appRoot 'backend-server.exe')
            $processes += Start-Process -PassThru -WindowStyle Hidden -WorkingDirectory (Join-Path $appRoot 'frontend') -FilePath (Join-Path $appRoot 'runtime/bun.exe') -ArgumentList 'server/index.mjs'

            $deadline = (Get-Date).AddSeconds(90)
            $backend = $null
            $frontend = $null

            while ((Get-Date) -lt $deadline -and (-not $backend -or -not $frontend)) {
              try { $backend = Invoke-WebRequest 'http://127.0.0.1:8787/healthz' -UseBasicParsing -TimeoutSec 2 } catch {}
              try { $frontend = Invoke-WebRequest 'http://127.0.0.1:3000/' -UseBasicParsing -TimeoutSec 2 } catch {}
              Start-Sleep -Milliseconds 500
            }

            if ($backend.StatusCode -ne 200 -or $frontend.StatusCode -ne 200) {
              throw 'Packaged backend or frontend did not become healthy.'
            }

            $assetMatches = [regex]::Matches($frontend.Content, '(?:src|href)="([^"]+\.(?:js|css))"')

            if ($assetMatches.Count -eq 0) {
              throw 'Frontend HTML contains no JavaScript or CSS assets.'
            }

            foreach ($match in $assetMatches) {
              $assetUrl = [Uri]::new([Uri]'http://127.0.0.1:3000/', $match.Groups[1].Value)
              $asset = Invoke-WebRequest $assetUrl -UseBasicParsing -TimeoutSec 10

              if ($asset.StatusCode -ne 200 -or $asset.RawContentLength -eq 0) {
                throw "Frontend asset failed: $assetUrl"
              }
            }
          } finally {
            $processes | Where-Object { $_ -and -not $_.HasExited } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

  publish:
    name: Publish draft release
    needs: [checksum, sign, verify-install]
    if: ${{ (github.event.inputs.publish_draft == 'true' && github.event.inputs.release_tag != '') || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download combined release artefacts
        # checksum job already assembled + verified release/. Publish
        # never re-hashes; it just uploads what the gate approved.
        uses: actions/download-artifact@v4
        with:
          name: release-combined
          path: release

      - name: Show release payload
        run: |
          ls -la release
          cat release/SHA256SUMS.txt

      - name: Generate Windows and Linux installers
        env:
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          repo = os.environ["RELEASE_REPO"]
          tag = os.environ["RELEASE_TAG"]
          replacements = {
              "__RELEASE_REPO__": repo,
              "__RELEASE_TAG__": tag,
          }

          for source_name, output_name in (
              ("packaging/desktop/install.ps1", "release/install.ps1"),
              ("packaging/desktop/install.sh", "release/install.sh"),
          ):
              content = Path(source_name).read_text(encoding="utf-8")

              for needle, value in replacements.items():
                  content = content.replace(needle, value)

              Path(output_name).write_text(content, encoding="utf-8", newline="\n")
          PY
          chmod +x release/install.sh

      - name: Validate install.ps1 syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'release/install.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }

            throw 'Generated install.ps1 failed PowerShell syntax validation.'
          }

      - name: Validate install.sh syntax
        run: bash -n release/install.sh

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.event.inputs.release_tag || github.ref_name, '-rc') || contains(github.event.inputs.release_tag || github.ref_name, '-beta') }}
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Automated draft release for ${{ github.event.inputs.release_tag || github.ref_name }}.

            Windows Authenticode signing enabled: `${{ vars.CODESIGN_ENABLED == 'true' }}`.

            Verify downloads against `SHA256SUMS.txt`:
              PowerShell: `Get-FileHash <file> -Algorithm SHA256`
              POSIX:      `sha256sum -c SHA256SUMS.txt`
